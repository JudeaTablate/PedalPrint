<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PedalPrint Dynamics Labs | FEU Tech</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            earthy: {
              blue: '#0EA5E9',
              deepBlue: '#0369A1',
              green: '#10B981',
              forest: '#047857',
              sage: '#84CC16',
              darkBg: '#0B132B',
              darkCard: '#1C2541'
            }
          }
        }
      }
    }
  </script>

  <!-- React 18, React-DOM, Babel, & Lucide Icons via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * {
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }
    .glass {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="bg-earthy-darkBg text-slate-100 font-sans min-h-screen selection:bg-earthy-green selection:text-white">

  <div id="root"></div>

  <!-- React Application Component -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    function PedalPrintApp() {
      const [darkMode, setDarkMode] = useState(true);
      const [isPlaying, setIsPlaying] = useState(true);
      const [selectedJoint, setSelectedJoint] = useState('knee');
      const [phaseSync, setPhaseSync] = useState(94.2);
      const [activeModal, setActiveModal] = useState(false);
      const [formSubmitted, setFormSubmitted] = useState(false);

      // Handle dark/light mode on the HTML element
      useEffect(() => {
        const root = document.documentElement;
        if (darkMode) {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }
      }, [darkMode]);

      // Re-initialize Lucide icons after renders
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Simulated live telemetry fluctuation
      useEffect(() => {
        if (!isPlaying) return;
        const interval = setInterval(() => {
          const variance = (Math.random() * 2 - 1) * 0.8;
          setPhaseSync(prev => Math.min(99.9, Math.max(88.0, +(prev + variance).toFixed(1))));
        }, 800);
        return () => clearInterval(interval);
      }, [isPlaying]);

      const jointData = {
        ankle: { title: "Ankle & Cleat Alignment", status: "Optimal", force: "142 N", risk: "Low", desc: "Plantar pressure evenly distributed across forefoot. Micro-compensations within baseline." },
        knee: { title: "Knee Valgus Trajectory", status: "Attention Needed", force: "380 N", risk: "Moderate", desc: "Inward knee valgus detected at 45° crank phase during heavy load. 3.2° lateral deviation." },
        hip: { title: "Pelvic & Hip Drop", status: "Stable", force: "510 N", risk: "Minimal", desc: "Symmetrical power transfer through left/right hip extensors." }
      };

      return (
        <div className={`min-h-screen transition-colors duration-300 ${darkMode ? 'bg-[#0B132B] text-slate-100' : 'bg-slate-50 text-slate-800'}`}>
          
          {/* HEADER */}
          <header className={`sticky top-0 z-40 glass border-b ${darkMode ? 'bg-[#0B132B]/80 border-slate-800' : 'bg-white/80 border-slate-200'}`}>
            <div className="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
              
              <div className="flex items-center gap-3">
                <div className="relative flex items-center justify-center w-11 h-11 rounded-2xl bg-gradient-to-br from-emerald-500 to-sky-500 shadow-lg shadow-emerald-500/20 text-white font-black text-xl">
                  <i data-lucide="activity" className="w-6 h-6 animate-pulse"></i>
                  <span className="absolute -top-1 -right-1 w-3 h-3 bg-emerald-400 rounded-full border-2 border-[#0B132B]"></span>
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-black tracking-tight text-lg bg-gradient-to-r from-sky-400 via-emerald-400 to-lime-400 bg-clip-text text-transparent">
                      PEDALPRINT
                    </span>
                    <span className="px-2 py-0.5 text-[10px] font-bold rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                      v2.6
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-400 font-medium">FEU Institute of Technology Lab</p>
                </div>
              </div>

              <nav className="hidden md:flex items-center gap-8 text-xs font-semibold uppercase tracking-wider text-slate-400">
                <a href="#telemetry" className="hover:text-emerald-400 transition-colors">Live Telemetry</a>
                <a href="#proponents" className="hover:text-emerald-400 transition-colors">Engineers</a>
                <a href="#location" className="hover:text-emerald-400 transition-colors">Lab Location</a>
              </nav>

              <div className="flex items-center gap-3">
                <button 
                  onClick={() => setDarkMode(!darkMode)}
                  className={`p-2.5 rounded-xl border transition-all ${darkMode ? 'bg-slate-800 border-slate-700 text-amber-400 hover:bg-slate-700' : 'bg-slate-100 border-slate-200 text-slate-700 hover:bg-slate-200'}`}
                >
                  <i data-lucide={darkMode ? "sun" : "moon"} className="w-4 h-4"></i>
                </button>
                <button 
                  onClick={() => setActiveModal(true)}
                  className="hidden sm:flex items-center gap-2 px-4 py-2.5 rounded-xl bg-gradient-to-r from-emerald-500 to-sky-500 hover:from-emerald-600 hover:to-sky-600 text-white font-bold text-xs shadow-lg shadow-emerald-500/20 transition-all"
                >
                  <i data-lucide="file-text" className="w-4 h-4"></i>
                  <span>Taiwan 2026 Proposal</span>
                </button>
              </div>
            </div>
          </header>

          {/* HERO & LIVE TELEMETRY SIMULATOR */}
          <section id="telemetry" className="relative py-12 lg:py-20 overflow-hidden">
            <div className="max-w-7xl mx-auto px-6 grid lg:grid-cols-12 gap-12 items-center">
              
              <div className="lg:col-span-5 space-y-6">
                <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full border border-sky-500/30 bg-sky-500/10 text-sky-400 text-xs font-semibold">
                  <i data-lucide="sparkles" className="w-3.5 h-3.5"></i>
                  <span>Kinetic Chain Fusion Architecture</span>
                </div>

                <h1 className="text-4xl sm:text-5xl font-black tracking-tight leading-none text-slate-900 dark:text-white">
                  Preventing Injury At The <span className="bg-gradient-to-r from-emerald-400 via-sky-400 to-lime-400 bg-clip-text text-transparent">Spindle & Sole.</span>
                </h1>

                <p className="text-sm sm:text-base text-slate-400 leading-relaxed">
                  PedalPrint correlates shoe insole pressure dynamics with pedal spindle torque vectors in real-time, catching biomechanical compensation before pain emerges.
                </p>

                <div className="grid grid-cols-2 gap-3 pt-2">
                  <div className={`p-4 rounded-2xl border ${darkMode ? 'bg-slate-900/60 border-slate-800' : 'bg-white border-slate-200'}`}>
                    <div className="flex items-center justify-between text-xs text-slate-400">
                      <span>Phase Correlation</span>
                      <i data-lucide="activity" className="w-4 h-4 text-emerald-400"></i>
                    </div>
                    <div className="text-2xl font-black text-emerald-400 mt-2 font-mono">{phaseSync}%</div>
                    <div className="text-[10px] text-slate-500 mt-1">Cross-sensor phase locking</div>
                  </div>

                  <div className={`p-4 rounded-2xl border ${darkMode ? 'bg-slate-900/60 border-slate-800' : 'bg-white border-slate-200'}`}>
                    <div className="flex items-center justify-between text-xs text-slate-400">
                      <span>Protocol Standard</span>
                      <i data-lucide="cpu" className="w-4 h-4 text-sky-400"></i>
                    </div>
                    <div className="text-2xl font-black text-sky-400 mt-2 font-mono">CCPA Ready</div>
                    <div className="text-[10px] text-slate-500 mt-1">Taiwan Cycling Standard</div>
                  </div>
                </div>
              </div>

              {/* Live Interactive Telemetry Console */}
              <div className="lg:col-span-7">
                <div className={`p-6 rounded-3xl border shadow-2xl relative ${darkMode ? 'bg-slate-900/90 border-slate-800' : 'bg-white border-slate-200'}`}>
                  
                  <div className="flex items-center justify-between pb-4 border-b border-slate-800 mb-6">
                    <div className="flex items-center gap-3">
                      <div className="flex gap-1.5">
                        <div className="w-3 h-3 rounded-full bg-rose-500"></div>
                        <div className="w-3 h-3 rounded-full bg-amber-500"></div>
                        <div className="w-3 h-3 rounded-full bg-emerald-500"></div>
                      </div>
                      <span className="text-xs font-mono font-bold text-slate-400">SYSTEM_STREAM // PEDALPRINT_CORE</span>
                    </div>

                    <button 
                      onClick={() => setIsPlaying(!isPlaying)}
                      className="p-2 rounded-lg bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 hover:bg-emerald-500/20 transition-all flex items-center gap-1.5 text-xs font-bold"
                    >
                      <i data-lucide={isPlaying ? "pause" : "play"} className="w-3.5 h-3.5"></i>
                      <span>{isPlaying ? 'PAUSE STREAM' : 'RESUME'}</span>
                    </button>
                  </div>

                  {/* Signal Wave Canvas Visualizer */}
                  <div className="relative h-48 bg-[#070D1E] rounded-2xl overflow-hidden border border-slate-800 p-4 flex flex-col justify-between">
                    <div className="absolute inset-0 flex items-center justify-center opacity-30">
                      <div className={`w-full h-full transition-all duration-700 ${isPlaying ? 'animate-pulse' : ''}`}>
                        <svg className="w-full h-full" viewBox="0 0 500 150" preserveAspectRatio="none">
                          <path d="M 0 75 Q 125 10, 250 75 T 500 75" fill="none" stroke="#0EA5E9" strokeWidth="3" />
                          <path d="M 0 75 Q 125 140, 250 75 T 500 75" fill="none" stroke="#10B981" strokeWidth="3" />
                        </svg>
                      </div>
                    </div>

                    <div className="relative z-10 flex justify-between items-start">
                      <div className="bg-slate-900/80 backdrop-blur px-3 py-1.5 rounded-lg border border-slate-700 text-[11px] font-mono text-sky-400 flex items-center gap-2">
                        <span className="w-2 h-2 rounded-full bg-sky-400 animate-ping"></span>
                        Spindle Torque: 28.4 Nm @ 90 RPM
                      </div>
                      <div className="bg-slate-900/80 backdrop-blur px-3 py-1.5 rounded-lg border border-slate-700 text-[11px] font-mono text-emerald-400">
                        Plantar Load: 84 kPa
                      </div>
                    </div>

                    <div className="relative z-10 text-center font-mono text-xs text-slate-400">
                      {isPlaying ? 'LIVE PHASE SYNC ACTIVE — RECORDING FRAME DATA' : 'STREAM PAUSED'}
                    </div>
                  </div>

                  {/* Clickable Joint Inspector */}
                  <div className="mt-6">
                    <div className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">
                      Click Joint to Inspect Load Spectrum:
                    </div>
                    
                    <div className="grid grid-cols-3 gap-2">
                      {Object.keys(jointData).map((joint) => (
                        <button
                          key={joint}
                          onClick={() => setSelectedJoint(joint)}
                          className={`p-3 rounded-xl border text-left transition-all ${
                            selectedJoint === joint
                              ? 'bg-gradient-to-r from-emerald-500/20 to-sky-500/20 border-emerald-400 text-white'
                              : 'bg-slate-800/40 border-slate-700/50 text-slate-400 hover:border-slate-600'
                          }`}
                        >
                          <div className="text-xs font-bold capitalize">{joint} Joint</div>
                          <div className="text-[10px] opacity-70 mt-0.5">{jointData[joint].status}</div>
                        </button>
                      ))}
                    </div>

                    <div className="mt-4 p-4 rounded-xl bg-slate-800/30 border border-slate-700/50 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                      <div>
                        <div className="text-xs font-bold text-emerald-400">{jointData[selectedJoint].title}</div>
                        <div className="text-xs text-slate-300 mt-1">{jointData[selectedJoint].desc}</div>
                      </div>
                      <div className="text-right shrink-0">
                        <span className="text-[10px] text-slate-400 uppercase block">Max Force</span>
                        <span className="text-sm font-mono font-bold text-sky-400">{jointData[selectedJoint].force}</span>
                      </div>
                    </div>

                  </div>

                </div>
              </div>

            </div>
          </section>

          {/* LEAD SOFTWARE ENGINEERS */}
          <section id="proponents" className={`py-16 border-t ${darkMode ? 'bg-slate-900/40 border-slate-800' : 'bg-slate-100 border-slate-200'}`}>
            <div className="max-w-7xl mx-auto px-6">
              
              <div className="max-w-2xl mx-auto text-center mb-12">
                <h2 className="text-3xl font-black text-slate-900 dark:text-white">Lead Software Engineers</h2>
                <p className="text-xs sm:text-sm text-slate-400 mt-2">
                  Architecting the kinetic signal correlation stack & user analytics platform at FEU Institute of Technology.
                </p>
              </div>

              <div className="grid md:grid-cols-2 gap-8 max-w-4xl mx-auto">
                
                <div className={`p-6 rounded-3xl border transition-all hover:scale-[1.01] ${darkMode ? 'bg-slate-900 border-slate-800 hover:border-emerald-500/50' : 'bg-white border-slate-200 hover:border-emerald-500'}`}>
                  <div className="flex items-start gap-4">
                    <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-500 to-sky-500 p-0.5 shrink-0">
                      <div className="w-full h-full rounded-[14px] bg-slate-900 flex items-center justify-center text-xl font-bold text-emerald-400">
                        JT
                      </div>
                    </div>
                    <div>
                      <h3 className="text-lg font-extrabold text-slate-900 dark:text-white">Judea Ann C. Tablate</h3>
                      <p className="text-xs font-semibold text-emerald-400">Software Engineer & Lead Proponent</p>
                      <p className="text-xs text-slate-400 mt-2 leading-relaxed">
                        Focuses on time-synchronized cross-correlation algorithms, firmware sensor nodes, and phase-locking plantar pressure signals with spindle dynamics.
                      </p>
                      <div className="mt-4 flex flex-wrap gap-2">
                        <span className="px-2.5 py-1 rounded-lg bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] font-mono">Signal Processing</span>
                        <span className="px-2.5 py-1 rounded-lg bg-sky-500/10 text-sky-400 border border-sky-500/20 text-[10px] font-mono">Algorithms</span>
                      </div>
                    </div>
                  </div>
                </div>

                <div className={`p-6 rounded-3xl border transition-all hover:scale-[1.01] ${darkMode ? 'bg-slate-900 border-slate-800 hover:border-sky-500/50' : 'bg-white border-slate-200 hover:border-sky-500'}`}>
                  <div className="flex items-start gap-4">
                    <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-sky-500 to-lime-500 p-0.5 shrink-0">
                      <div className="w-full h-full rounded-[14px] bg-slate-900 flex items-center justify-center text-xl font-bold text-sky-400">
                        LH
                      </div>
                    </div>
                    <div>
                      <h3 className="text-lg font-extrabold text-slate-900 dark:text-white">Lana Denise R. Huertas</h3>
                      <p className="text-xs font-semibold text-sky-400">Software Engineer & Lead Proponent</p>
                      <p className="text-xs text-slate-400 mt-2 leading-relaxed">
                        Specializes in real-time UI/UX visualization platforms, cloud infrastructure, and integrating low-power Bluetooth CCPA protocols for live athlete feedback.
                      </p>
                      <div className="mt-4 flex flex-wrap gap-2">
                        <span className="px-2.5 py-1 rounded-lg bg-sky-500/10 text-sky-400 border border-sky-500/20 text-[10px] font-mono">System UI/UX</span>
                        <span className="px-2.5 py-1 rounded-lg bg-lime-500/10 text-lime-400 border border-lime-500/20 text-[10px] font-mono">Cloud Architecture</span>
                      </div>
                    </div>
                  </div>
                </div>

              </div>

            </div>
          </section>

          {/* LOCATION & CONTACT */}
          <section id="location" className="py-16">
            <div className="max-w-7xl mx-auto px-6 grid lg:grid-cols-2 gap-12 items-center">
              
              <div>
                <div className="inline-flex items-center gap-2 text-emerald-400 font-bold text-xs uppercase tracking-wider mb-2">
                  <i data-lucide="map-pin" className="w-4 h-4"></i> Lab Location & Institutional Support
                </div>
                <h2 className="text-3xl font-extrabold text-slate-900 dark:text-white">FEU Institute of Technology</h2>
                <p className="mt-4 text-sm text-slate-400 leading-relaxed">
                  Developed within the research facilities of FEU Tech in Manila, Philippines. Focused on translating academic software engineering into real-world sports healthcare systems.
                </p>

                <div className="mt-6 space-y-3">
                  <div className="p-4 rounded-2xl bg-slate-900/50 border border-slate-800 flex items-center gap-3 text-xs text-slate-300">
                    <i data-lucide="building" className="w-5 h-5 text-emerald-400 shrink-0"></i>
                    <span>P. Paredes St, Sampaloc, Manila, 1008 Metro Manila, Philippines</span>
                  </div>
                  <div className="p-4 rounded-2xl bg-slate-900/50 border border-slate-800 flex items-center gap-3 text-xs text-slate-300">
                    <i data-lucide="mail" className="w-5 h-5 text-sky-400 shrink-0"></i>
                    <span>pedalprint@feutech.edu.ph</span>
                  </div>
                </div>
              </div>

              {/* Interactive Form */}
              <div className={`p-8 rounded-3xl border ${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                <h3 className="text-lg font-bold text-slate-900 dark:text-white mb-1">Connect with the Research Team</h3>
                <p className="text-xs text-slate-400 mb-6">Inquire regarding partnerships, clinical validation pilots, or protocol licensing.</p>

                {formSubmitted ? (
                  <div className="p-6 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 text-center space-y-2">
                    <i data-lucide="check-circle-2" className="w-8 h-8 text-emerald-400 mx-auto"></i>
                    <div className="text-sm font-bold text-emerald-400">Message Transmitted</div>
                    <p className="text-xs text-slate-400">Thank you! The engineering team will review your message shortly.</p>
                  </div>
                ) : (
                  <form onSubmit={(e) => { e.preventDefault(); setFormSubmitted(true); }} className="space-y-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Name</label>
                      <input type="text" required placeholder="e.g. Dr. Alex Vance" className="w-full px-4 py-2.5 rounded-xl bg-slate-800/50 border border-slate-700 text-xs text-white focus:outline-none focus:border-emerald-400 transition-colors" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Email</label>
                      <input type="email" required placeholder="alex@institution.org" className="w-full px-4 py-2.5 rounded-xl bg-slate-800/50 border border-slate-700 text-xs text-white focus:outline-none focus:border-emerald-400 transition-colors" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Message</label>
                      <textarea rows="3" required placeholder="Describe your interest in PedalPrint..." className="w-full px-4 py-2.5 rounded-xl bg-slate-800/50 border border-slate-700 text-xs text-white focus:outline-none focus:border-emerald-400 transition-colors"></textarea>
                    </div>
                    <button type="submit" className="w-full py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-sky-500 hover:from-emerald-600 hover:to-sky-600 text-white font-bold text-xs shadow-lg shadow-emerald-500/20 transition-all">
                      Send Communication
                    </button>
                  </form>
                )}
              </div>

            </div>
          </section>

          {/* FOOTER */}
          <footer className={`py-8 border-t ${darkMode ? 'bg-slate-900/80 border-slate-800' : 'bg-white border-slate-200'}`}>
            <div className="max-w-7xl mx-auto px-6 flex flex-col sm:flex-row justify-between items-center gap-4 text-xs text-slate-500">
              <div>© 2026 PedalPrint Dynamics Labs. FEU Institute of Technology.</div>
              <div>Engineers: Judea Ann C. Tablate & Lana Denise R. Huertas</div>
            </div>
          </footer>

          {/* PROPOSAL MODAL */}
          {activeModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className={`max-w-2xl w-full p-6 rounded-3xl border shadow-2xl max-h-[80vh] overflow-y-auto ${darkMode ? 'bg-slate-900 border-slate-800 text-slate-200' : 'bg-white border-slate-200 text-slate-800'}`}>
                <div className="flex items-center justify-between pb-4 border-b border-slate-800 mb-4">
                  <h3 className="font-bold text-sm text-emerald-400 flex items-center gap-2">
                    <i data-lucide="file-text" className="w-4 h-4"></i> Go Healthy with Taiwan 2026 — Proposal Excerpt
                  </h3>
                  <button onClick={() => setActiveModal(false)} className="text-slate-400 hover:text-white">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>
                
                <div className="space-y-4 text-xs leading-relaxed text-slate-300">
                  <p><strong>Proposal Title:</strong> PedalPrint: A Kinetic Chain Fusion System Pairing Taiwan's Crank and Insole Engineering for Predictive Cycling Injury Prevention</p>
                  <p><strong>Proponents:</strong> Judea Ann C. Tablate & Lana Denise R. Huertas (Software Engineers, FEU Institute of Technology)</p>
                  <p><strong>Core Insight:</strong> Current cycling market tools either measure crank torque (Garmin, Wahoo) or insole pressure (Moticon) in isolation. PedalPrint fuses both data streams using a phase-locked correlation algorithm to catch biomechanical compensation early.</p>
                  <p><strong>Ecosystem Integration:</strong> Directly compatible with the Cycling Common Protocol Alliance (CCPA) standard from Taiwan's CHC, creating interoperability across e-bike systems and wearables.</p>
                </div>

                <div className="mt-6 text-right">
                  <button onClick={() => setActiveModal(false)} className="px-4 py-2 rounded-xl bg-emerald-500 text-white text-xs font-bold">
                    Close Viewer
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PedalPrintApp />);
  </script>
</body>
</html>
